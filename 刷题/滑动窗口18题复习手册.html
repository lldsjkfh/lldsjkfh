/* ---------- 分组分隔条 ---------- */

<script>
var INTRO = {
  title: "定长滑动窗口 · 通用套路",
  lead: "这 8 道题都来自 LeetCode 中文站「滑动窗口 · 定长窗口」题单的基础部分，难度分从 1263 到 1574。骨架完全一样：维护一个长度恒为 k 的窗口，右进左出，每滑一步更新答案。差别只在两件事——窗口里维护什么统计量、答案是什么形式。",
  blocks: [
    {
      h: "一句话本质",
      p: "定长滑动窗口 = 维护一个长度为 k 的队列。右指针移动视作入队，左指针移动视作出队。因为长度固定，两个端点永远同步向前：i 每走一格，就「进来一个、出去一个」。窗口内的统计量只需要增量更新（加新元素、减老元素），不需要每次重新计算，所以整个过程是 O(n)。"
    },
    {
      h: "四步模板",
      p: "① 决定窗口里维护什么：一个 long long 存和，或一个 int 存满足条件的元素个数，或一张哈希表做去重统计。\n② 先把前 k 个元素放进窗口（也就是初始化统计量）。\n③ 从下标 k 开始滑动：先把 nums[i] 加进来，再把 nums[i-k] 移出去。\n④ 每滑完一步，立刻用当前统计量更新答案。",
      formula: "窗口统计量 ← 统计量 + 新进入的元素 − 移出窗口的元素\n答案 ← 用第 ③ 步之后的统计量更新（此时窗口正好是 [i-k+1, i]）"
    },
    {
      h: "两种等价写法，选一种吃透",
      p: "写法一用单循环 + 提前 continue 跳过窗口未成形的前 k-1 步，初始化与滑动共用一套代码（2841、2461 用的就是它）；写法二先单独铺满第一个窗口，再整窗右移，读起来更直观（643、1343 用的就是它）。两种都可以，关键是别混着写，混着写最容易把出队下标写错。"
    },
    {
      h: "什么时候统计量要升级",
      p: "判断依据只有一句：滑一步之后，这个统计量能不能 O(1) 更新出来。求和、计数能，就直接用变量；要「窗口内有几种不同的元素」这种信息，就必须用哈希表记每个值出现了几次，否则每次都要重新扫一遍窗口。"
    }
  ],
  codes: [
    {
      title: "写法一：单循环 + 提前 continue（推荐背下来）",
      code: "// ---------- 定长滑窗 · 通用模板（写法一） ----------\nint n = nums.size();                 // n 为数组长度，窗口长度固定为 k\nlong long s = 0;                     // ① 窗口内维护的统计量：元素和\nunordered_map<int, int> cnt;         //    需要去重时再加一张哈希表：值 -> 出现次数\nlong long ans = 0;                   //    答案（按题目要求初始化）\n\nfor (int i = 0; i < n; ++i) {\n    // ② 右指针入队：新元素进入窗口\n    s += nums[i];\n    ++cnt[nums[i]];\n\n    if (i < k - 1) continue;         // 窗口还不足 k 个，先不结算\n\n    // ③ 此时窗口是 [i - k + 1, i]，正好 k 个元素，结算答案\n    if ((int)cnt.size() == k) ans = max(ans, s);\n\n    // ④ 左指针出队：为下一次滑动做准备\n    int out = i - k + 1;             // 最左边的元素即将离开窗口\n    s -= nums[out];\n    if (--cnt[nums[out]] == 0) cnt.erase(nums[out]);   // 计数减到 0 必须删键！\n}\nreturn ans;"
    },
    {
      title: "写法二：先铺满第一个窗口，再整窗右移",
      code: "// ---------- 定长滑窗 · 通用模板（写法二） ----------\nlong long s = 0;\nfor (int i = 0; i < k; ++i) s += nums[i];   // 第一个窗口 [0, k-1]\nlong long ans = s;                          // 用它初始化答案\n\nfor (int i = k; i < n; ++i) {\n    // 窗口整体右移一位：右边进来 nums[i]，左边出去 nums[i - k]\n    s += nums[i] - nums[i - k];\n    ans = max(ans, s);                      // 滑完立刻更新答案\n}\nreturn ans;"
    }

window.__err = window.__err || [];
window.addEventListener('error', function (e) { window.__err.push(String(e && e.message)); });

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function plain(s) { return String(s == null ? '' : s).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' '); }
function paras(text) {
  return String(text).split('\n').filter(function (t) { return t.trim(); })
    .map(function (t) { return '<p>' + t + '</p>'; }).join('');
}

/* ==================== C++ 极简高亮 ==================== */
var CPP_KW = /^(?:class|struct|public|private|protected|int|long|double|float|bool|char|void|unsigned|signed|short|return|for|while|if|else|continue|break|const|static|auto|using|namespace|template|typename|default|switch|case|new|delete|sizeof|vector|string|unordered_map|map|set|queue|stack|pair|max|min|abs|swap|sort|size|empty|push_back|emplace_back|begin|end|resize|assign|erase|insert|first|second|true|false|nullptr|this|operator)$/;

function hl(src) {
  var out = '', i = 0, n = src.length, c, j, q, k, m, w;
  while (i < n) {
    c = src.charAt(i);
    if (c === '/' && src.charAt(i + 1) === '/') {
      j = src.indexOf('\n', i);
      if (j < 0) j = n;
      out += '<span class="cm">' + esc(src.slice(i, j)) + '</span>';
      i = j; continue;
    }
    if (c === '"' || c === '\u0027') {
      q = c; k = i + 1;
      while (k < n && src.charAt(k) !== q) { if (src.charAt(k) === '\\') ++k; ++k; }
      k = Math.min(k + 1, n);
      out += '<span class="st">' + esc(src.slice(i, k)) + '</span>';
      i = k; continue;
    }
    if (/[A-Za-z0-9_]/.test(c)) {
      m = i;
      while (m < n && /[A-Za-z0-9_]/.test(src.charAt(m))) ++m;
      w = src.slice(i, m);
      if (/^[0-9]/.test(w)) out += '<span class="nu">' + esc(w) + '</span>';
      else if (CPP_KW.test(w)) out += '<span class="kw">' + esc(w) + '</span>';
      else out += esc(w);
      i = m; continue;
    }
    out += esc(c); i++;
  }
  return out;
}

    plain(p.related), plain(p.demoIntro), plain(p.demo.legend),
    p.complexity.time, p.complexity.space,
    p.group === 'var' ? '不定长 可变窗口' : '定长 固定窗口'];
  return arr.join(' ').toLowerCase();
}

/* ==================== 窗口统计 ==================== */
function statsOf(arr, l, r) {
  var sum = 0, distinct = 0, vowel = 0, black = 0, zeros = 0, maxCount = 0, i, v, key;
  var seen = {};
  for (i = l; i <= r; i++) {
    v = arr[i];
    if (typeof v === 'number') { sum += v; if (v === 0) zeros++; }
    else if (v === '0') zeros++;
    key = String(v);
    seen[key] = (seen[key] || 0) + 1;
    if (seen[key] > maxCount) maxCount = seen[key];
    if (seen[key] === 1) distinct++;
    if ('aeiou'.indexOf(key.toLowerCase()) >= 0) vowel++;
    if (key === 'B') black++;
  }
  return { sum: sum, distinct: distinct, vowel: vowel, black: black, zeros: zeros, maxCount: maxCount, len: r - l + 1 };
}

/* ==================== 动画：定长（等宽窗口） ==================== */
function buildFixedSteps(d) {
  var arr = d.arr, n = arr.length, steps = [], st, i, l, r, c, w, total = 0;
  for (i = 0; i < n; i++) if (typeof arr[i] === 'number') total += arr[i];

  if (d.rule === 'centeredAvg') {
    var rad = d.radius, len = 2 * rad + 1;
    for (c = rad; c + rad < n; c++) {
      l = c - rad; r = c + rad; st = statsOf(arr, l, r);
      var avg = st.sum / len;
      steps.push({
        l: l, r: r, center: c, st: st,
        chips: [{ t: '窗口和', v: String(st.sum) }, { t: '元素个数', v: String(len) }, { t: '平均值', v: avg.toFixed(3) }],
        ans: 'avgs[' + c + '] = ' + st.sum + ' / ' + len + ' ≈ ' + avg.toFixed(5),
        note: '中心 c = ' + c + '，窗口 [' + l + ', ' + r + ']，共 ' + len + ' 个元素。'
      });
    }
    return steps;
  }

  w = (d.rule === 'maxPoints') ? (n - d.k) : d.win;
  var best = null, cnt = 0, mn = null, target = 0, hit = false, good = false, note;

  for (i = 0; i + w <= n; i++) {
    l = i; r = i + w - 1; st = statsOf(arr, l, r);
    var chips = [], ans = '', ok = false;
    note = (i === 0)
      ? '第一个窗口 [' + l + ', ' + r + ']，先数出它里面的统计量。'
      : '窗口整体右移一位：' + arr[r] + ' 进来，' + arr[r - w] + ' 出去。';

    if (d.rule === 'maxVowel') {
      best = (best === null) ? st.vowel : Math.max(best, st.vowel);
      ok = st.vowel === best;
      chips = [{ t: '窗口内元音', v: String(st.vowel) }];
      ans = '最大元音数 = ' + best;
    } else if (d.rule === 'maxAvg') {
      best = (best === null) ? st.sum : Math.max(best, st.sum);
      ok = st.sum === best;
      chips = [{ t: '窗口和', v: String(st.sum) }];
      ans = '最大和 = ' + best + '  →  最大平均数 = ' + (best / w).toFixed(5);
    } else if (d.rule === 'countGE') {
      target = w * d.threshold;
      hit = st.sum >= target;
      if (hit) cnt++;
      ok = hit;
      chips = [{ t: '窗口和', v: String(st.sum) }, { t: '达标（≥ ' + target + '）', v: hit ? '是' : '否', yes: hit }];
      ans = '已计数 ' + cnt + ' 个达标窗口';
    } else if (d.rule === 'minFlips') {
      best = (best === null) ? st.black : Math.max(best, st.black);
      ok = st.black === best;
      chips = [{ t: '窗口内黑块 B', v: String(st.black) }, { t: '窗口内白块 W', v: String(w - st.black) }];
      ans = '黑块最多 ' + best + '  →  最少涂色 = ' + w + ' − ' + best + ' = ' + (w - best);
    } else if (d.rule === 'almostUnique') {
      good = st.distinct >= d.m;
      ok = good;
      if (good) best = (best === null) ? st.sum : Math.max(best, st.sum);
      chips = [{ t: '窗口和', v: String(st.sum) }, { t: '不同元素', v: st.distinct + ' 种' },
        { t: '达标（≥ ' + d.m + ' 种）', v: good ? '是' : '否', yes: good }];
      ans = '最大和 = ' + (best === null ? '0（暂无达标窗口）' : best);
    } else if (d.rule === 'distinctK') {
      good = st.distinct === w;
      ok = good;
      if (good) best = (best === null) ? st.sum : Math.max(best, st.sum);
      chips = [{ t: '窗口和', v: String(st.sum) }, { t: '不同元素', v: st.distinct + ' 种' },
        { t: '达标（恰好 ' + w + ' 种）', v: good ? '是' : '否', yes: good }];
      ans = '最大和 = ' + (best === null ? '0（暂无达标窗口）' : best);
    } else if (d.rule === 'maxPoints') {
      mn = (mn === null) ? st.sum : Math.min(mn, st.sum);
      ok = st.sum === mn;
      chips = [{ t: '中间窗口和', v: String(st.sum) }, { t: '中间牌数 n−k', v: String(w) }];
      ans = '中间最小和 = ' + mn + '  →  可取点数 = ' + total + ' − ' + mn + ' = ' + (total - mn);
    }

    steps.push({ l: l, r: r, st: st, chips: chips, ans: ans, note: note, ok: ok, edge: d.rule === 'maxPoints' });
  }
  return steps;
}

/* ==================== 动画：不定长（可变窗口） ==================== */
function varWindow(d, arr, l, r) {
  var st = statsOf(arr, l, r), len = r - l + 1, chips = [], ok = false, why = '', need = 0;
  switch (d.rule) {
    case 'varNoRepeat':
      ok = (st.distinct === len);
      chips = [{ t: '窗口长度', v: String(len) }, { t: '不同字符', v: st.distinct + ' 种' },
        { t: '窗口内无重复', v: ok ? '是' : '否', yes: ok }];
      why = '窗口内出现了重复字符';
      break;
    case 'varTwoOcc':
      ok = (st.maxCount <= 2);
      chips = [{ t: '窗口长度', v: String(len) }, { t: '单个字符最多出现', v: st.maxCount + ' 次' },
        { t: '上限 2 次', v: ok ? '未超' : '超出', yes: ok }];
      why = '某个字符出现了超过 2 次';
      break;
    case 'varOneZero':
      ok = (st.zeros <= 1);
      chips = [{ t: '窗口长度', v: String(len) }, { t: '窗口内 0 的个数', v: String(st.zeros) },
        { t: '可删的 0 只有 1 个', v: ok ? '够用' : '超出', yes: ok }];
      why = '窗口里有 2 个以上的 0';
      break;
    case 'varBalance':
      var minv = arr[l], maxv = arr[r], lim = minv * d.k;
      ok = (maxv <= lim);
      chips = [{ t: '最小值 arr[l]', v: String(minv) }, { t: '最大值 arr[r]', v: String(maxv) },
        { t: '上限 min×k', v: String(lim) + (ok ? '（够）' : '（不够）'), yes: ok }];
      why = maxv + ' > ' + minv + ' × ' + d.k + ' = ' + lim + '，超出倍数限制';
      break;
    case 'varCost':
      ok = (st.sum <= d.maxCost);
      chips = [{ t: '窗口累计代价', v: String(st.sum) }, { t: '预算 maxCost', v: String(d.maxCost) + (ok ? '（有余）' : '（超了）'), yes: ok }];
      why = '累计代价 ' + st.sum + ' 超过预算 ' + d.maxCost;
      break;
    case 'varTwoKinds':
      ok = (st.distinct <= 2);
      chips = [{ t: '水果种类数', v: st.distinct + ' 种' }, { t: '只有 2 个篮子', v: ok ? '够装' : '装不下', yes: ok }];
      why = '窗口里出现了 3 种水果';
      break;
    case 'varDistinctSum':
      ok = (st.distinct === len);
      chips = [{ t: '窗口和', v: String(st.sum) }, { t: '不同元素', v: st.distinct + ' 种' },
        { t: '无重复元素', v: ok ? '是' : '否', yes: ok }];
      why = '窗口内出现了重复元素';
      break;
    case 'varAtMostK':
      ok = (st.maxCount <= d.k);
      chips = [{ t: '窗口长度', v: String(len) }, { t: '单个元素最多出现', v: st.maxCount + ' 次' },
        { t: '上限 k', v: d.k + ' 次' + (ok ? '（未超）' : '（超出）'), yes: ok }];
      why = '某个元素出现了超过 ' + d.k + ' 次';
      break;
    case 'varReplaceK':
      need = len - st.maxCount;
      ok = (need <= d.k);
      chips = [{ t: '窗口长度', v: String(len) }, { t: '占多数的字符', v: st.maxCount + ' 个' },
        { t: '需修改', v: need + ' 个' + (ok ? '（够改）' : '（超 k）'), yes: ok }];
      why = '需要改 ' + need + ' 个字符，超过 k = ' + d.k;
      break;
    case 'varZerosK':
      ok = (st.zeros <= d.k);
      chips = [{ t: '窗口长度', v: String(len) }, { t: '窗口内 0 的个数', v: String(st.zeros) },
        { t: '可翻转 0 的个数', v: d.k + ' 个' + (ok ? '（够）' : '（不够）'), yes: ok }];
      why = '窗口里 0 的个数超过 k = ' + d.k;
      break;
  }
  return { ok: ok, st: st, chips: chips, why: why, len: len };
}

function buildVarSteps(d) {
  var arr = d.arr, n = arr.length, steps = [], l = 0, r, ans = 0, w, oldL, bad, note, prev;
  for (r = 0; r < n; r++) {
    oldL = l;
    w = varWindow(d, arr, l, r);
    bad = '';
    while (!w.ok && l < r) {
      bad = w.why;
      l++;
      w = varWindow(d, arr, l, r);
    }
    var len = r - l + 1, prev2 = ans;
    if (d.rule === 'varOneZero') ans = Math.max(ans, len - 1);
    else if (d.rule === 'varDistinctSum') ans = Math.max(ans, w.st.sum);
    else ans = Math.max(ans, len);

    var ansText;
    if (d.rule === 'varBalance') ansText = '最长平衡段 = ' + ans + '  →  最少移除 = ' + n + ' − ' + ans + ' = ' + (n - ans);
    else if (d.rule === 'varOneZero') ansText = '最多连续 1 = ' + ans + '（窗口长度 ' + len + ' − 1）';
    else if (d.rule === 'varDistinctSum') ansText = '最大得分 = ' + ans;
    else if (d.rule === 'varCost') ansText = '最长可转换长度 = ' + ans;
    else ansText = '最长长度 = ' + ans;

    if (l > oldL) {
      note = '第 ' + r + ' 位进来后窗口不合法（' + bad + '），左端点从 ' + oldL + ' 收缩到 ' + l + '，现在窗口 [' + l + ', ' + r + ']。';
    } else {
      note = '右端点走到 ' + r + '，窗口 [' + l + ', ' + r + '] 合法，长度 ' + len + '。';
    }

    steps.push({ l: l, r: r, st: w.st, chips: w.chips, ans: ansText, note: note, ok: (ans > prev2 || r === 0) });
  }
  return steps;
}

function buildSteps(d) {
  return (d.mode === 'var') ? buildVarSteps(d) : buildFixedSteps(d);
}

/* ==================== 动画播放 ==================== */
var DEMOS = {};
function initDemo(i) {
  var box = document.querySelector('.demo[data-demo="' + i + '"]');
  var steps = buildSteps(PROBLEMS[i].demo);
  DEMOS[i] = { el: box, steps: steps, cur: 0, timer: null, arr: PROBLEMS[i].demo.arr };
  var track = box.querySelector('.track'), h = '';
  for (var c = 0; c < PROBLEMS[i].demo.arr.length; c++) {
    h += '<div class="cell"><div class="idx">' + c + '</div><div class="box">' +
      esc(PROBLEMS[i].demo.arr[c]) + '</div></div>';
  }
  track.innerHTML = h;
  renderStep(i);
}

function renderStep(i) {
  var d = DEMOS[i], s = d.steps[d.cur];
  if (!s) return;
  var box = d.el;
  var cells = box.querySelectorAll('.cell');
  for (var c = 0; c < cells.length; c++) {
    var inWin = (c >= s.l && c <= s.r);
    cells[c].classList.toggle('in', inWin);
    cells[c].classList.toggle('ok', inWin && !!s.ok);
    cells[c].classList.toggle('center', s.center === c);
    cells[c].classList.toggle('edge', !!s.edge && !inWin);
  }
  box.querySelector('.stats').innerHTML = s.chips.map(function (ch) {
    var cls = (ch.yes === true) ? ' yes' : (ch.yes === false ? ' no' : '');
    return '<span class="stat' + cls + '">' + esc(ch.t) + ' = ' + esc(String(ch.v)) + '</span>';
  }).join('');
  box.querySelector('.answer').textContent = s.ans;
  box.querySelector('.note').textContent = s.note;
  box.querySelector('.step-badge').textContent = '第 ' + (d.cur + 1) + ' / ' + d.steps.length + ' 步';
  box.querySelector('[data-act="prev"]').disabled = (d.cur === 0);
  box.querySelector('[data-act="next"]').disabled = (d.cur === d.steps.length - 1);
  var pb = box.querySelector('[data-act="play"]');
  pb.textContent = d.timer ? '暂停' : (d.cur === d.steps.length - 1 ? '重播' : '自动播放');
}

function stopPlay(i) {
  var d = DEMOS[i];
  if (d.timer) { clearInterval(d.timer); d.timer = null; }
  renderStep(i);
}

function togglePlay(i) {
  var d = DEMOS[i];
  if (d.timer) { stopPlay(i); return; }
  if (d.cur >= d.steps.length - 1) { d.cur = 0; renderStep(i); }
  d.timer = setInterval(function () {
    if (d.cur >= d.steps.length - 1) { stopPlay(i); return; }
    d.cur++; renderStep(i);
  }, 780);
  renderStep(i);
}

function copyText(text, btn) {
  var done = function () { var old = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(function () { btn.textContent = old; }, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', 'readonly');
  ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}

function initScrollSpy() {
  var ticking = false, activeId = '';
  function update() {
    ticking = false;
    var y = window.scrollY + 150, cards = document.querySelectorAll('main .card'), cur = '';
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].hidden) continue;
      if (cards[i].offsetTop <= y) cur = cards[i].id;
    }
    if (!cur) { for (var j = 0; j < cards.length; j++) { if (!cards[j].hidden) { cur = cards[j].id; break; } } }
    if (cur === activeId) return;
    activeId = cur;
    document.querySelectorAll('#toc a').forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + cur);
    });
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
  });
  update();
}

    i2.setAttribute('data-search', introHay(INTRO2) + ' 不定长 可变窗口');
  }

  var toc = '<div class="navtitle">目录 · 点题号跳转</div>';
  GROUP_ORDER.forEach(function (g) {
    var list = PROBLEMS.filter(function (p) { return p.group === g; });
    if (!list.length) return;
    toc += '<div class="navgroup" data-g="' + g + '">' + esc(GROUP_META[g].name) + ' · ' + list.length + ' 题</div>';
    toc += '<a href="#' + (g === 'fixed' ? 'intro' : 'intro2') + '" data-g="' + g + '"><span class="n">序</span>' +
      (g === 'fixed' ? '定长套路' : '不定长套路') + '</a>';
    list.forEach(function (p) {
      toc += '<a href="#' + p.id + '" data-g="' + g + '"><span class="n">' + esc(p.num) + '</span>' + esc(p.title) + '</a>';
    });
  });
  document.getElementById('toc').innerHTML = toc;

  PROBLEMS.forEach(function (p, i) {
    document.getElementById(p.id).setAttribute('data-search', haystack(p));
    initDemo(i);
  });

  // 恢复笔记
  PROBLEMS.forEach(function (p) {
    var ta = document.getElementById('note-' + p.id), v = load(NOTE_KEY + p.id);
    if (ta && v) { ta.value = v; document.querySelector('[data-save="' + p.id + '"]').textContent = '已载入上次保存的笔记'; }
  });

  // 恢复进度
  try { mastered = JSON.parse(load(MASTER_KEY) || '{}') || {}; } catch (e) { mastered = {}; }
  PROBLEMS.forEach(function (p) {
    var cb = document.querySelector('input[data-mastered="' + p.id + '"]');
    if (cb && mastered[p.id]) { cb.checked = true; cb.closest('label').classList.add('done'); }
  });
  updateProgress();

  // 主题
  applyTheme(load(THEME_KEY) === 'dark' ? 'dark' : 'light');
  document.getElementById('theme').addEventListener('click', function () {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  document.getElementById('export').addEventListener('click', exportMD);

  initSearch();
  initScrollSpy();
})();

/* ==================== 事件委托 ==================== */
document.getElementById('problems').addEventListener('click', function (e) {
  var btn = e.target.closest ? e.target.closest('button') : null;
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  if (act) {
    var dbox = btn.closest('.demo');
    var i = parseInt(dbox.getAttribute('data-demo'), 10);
    var d = DEMOS[i];
    if (act === 'prev') { stopPlay(i); if (d.cur > 0) { d.cur--; renderStep(i); } }
    else if (act === 'next') { stopPlay(i); if (d.cur < d.steps.length - 1) { d.cur++; renderStep(i); } }
    else if (act === 'reset') { stopPlay(i); d.cur = 0; renderStep(i); }
    else if (act === 'play') { togglePlay(i); }
    return;
  }
  var cp = btn.getAttribute('data-copy');
  if (cp !== null) copyText(RAWS[parseInt(cp, 10)], btn);
});

document.getElementById('problems').addEventListener('input', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute || !t.getAttribute('data-note')) return;
  var id = t.getAttribute('data-note');
  var status = document.querySelector('[data-save="' + id + '"]');
  if (status) status.textContent = '输入中…';
  clearTimeout(t.__timer);
  t.__timer = setTimeout(function () {
    store(NOTE_KEY + id, t.value);
    if (status) status.textContent = '已保存 ' + new Date().toTimeString().slice(0, 5);
  }, 450);
});

document.getElementById('problems').addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.getAttribute || !t.getAttribute('data-mastered')) return;
  var id = t.getAttribute('data-mastered');
  mastered[id] = t.checked;
  store(MASTER_KEY, JSON.stringify(mastered));
  var lab = t.closest('label');
  if (lab) lab.classList.toggle('done', t.checked);
  updateProgress();
});
</script>
</body>
</html>
